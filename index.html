<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortaí</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 16px;
           background: #030a06; color: #cfe8d4; font-family: system-ui, sans-serif; }
    canvas { width: min(960px, calc(100vw - 32px)); aspect-ratio: 16 / 9; border-radius: 8px;
             touch-action: none; cursor: crosshair; }
    footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #3c7a4c;
             background: #12301c; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <canvas></canvas>
  <footer>
    <span>Arraste para cortar as frutas. Não corte as bombas.</span>
    <button id="dataset">Gerar dataset</button>
  </footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
